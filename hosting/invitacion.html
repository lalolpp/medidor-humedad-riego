<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Medidor de Humedad - Invitación</title>
  <meta name="theme-color" content="#1b5e20" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1720;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #16212e;
      border: 1px solid #2a3a4c;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0,0,0,.4);
    }
    .logo {
      font-size: 40px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px;
      color: #81c784;
    }
    p {
      font-size: 14px;
      color: #9fb0c0;
      margin: 0 0 20px;
      line-height: 1.5;
    }
    .code {
      background: #0b1117;
      border: 1px dashed #3d5a3d;
      border-radius: 10px;
      padding: 14px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #a5d6a7;
      margin-bottom: 20px;
      word-break: break-all;
      cursor: pointer;
    }
    .btn {
      display: block;
      width: 100%;
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: #388e3c; }
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #7d8f9f;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #2e7d32;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">💧</div>
    <h1>Medidor de Humedad</h1>
    <p>Te han invitado a ver un campo en tiempo real.
       Descarga la app e ingresa este código al registrarte:</p>
    <div class="code" id="code" title="Toca para copiar">—</div>
    <a class="btn" href="https://github.com/lalolpp/medidor-humedad-apk/releases/latest/download/medidor-humedad.apk" target="_blank" rel="noopener">📲 Descargar app (Android)</a>
    <div class="hint">1. Descarga e instala la app.<br>2. Regístrate e ingresa el código de invitación.</div>
  </div>
  <div class="toast" id="toast">Código copiado</div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = (params.get('token') || '').trim();
      var codeEl = document.getElementById('code');
      if (token) {
        codeEl.textContent = token;
      } else {
        codeEl.textContent = 'SIN CÓDIGO';
        codeEl.style.color = '#e57373';
        codeEl.style.borderColor = '#7f1d1d';
      }
      var toast = document.getElementById('toast');
      codeEl.addEventListener('click', function () {
        if (!token) return;
        navigator.clipboard.writeText(token).then(function () {
          toast.classList.add('show');
          setTimeout(function () { toast.classList.remove('show'); }, 1500);
        });
      });
    })();
  </script>
</body>
</html>
