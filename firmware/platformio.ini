[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    bblanchon/ArduinoJson@^7.4.1

; Build con soporte OTA: requiere grabar UNA VEZ por USB esta configuración
; (esquema de particiones con 2 slots). Luego las actualizaciones son remotas.
[env:esp32dev_ota]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_ota.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DENABLE_OTA

lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    bblanchon/ArduinoJson@^7.4.1

; Igual que esp32dev_ota pero para pruebas en banco (USB): sin deep sleep, BLE
; siempre visible y ciclo de nube repetido cada intervalo (DEBUG_ALWAYS_ON).
[env:esp32dev_ota_debug]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_ota.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DENABLE_OTA
    -DDEBUG_ALWAYS_ON=1
    -DVALVE_RECHECK_MS=5000

lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    bblanchon/ArduinoJson@^7.4.1
