name: FCM Alertas de riego

# ⚠️ DESACTIVADO (2026-08-22): las ejecuciones automáticas cada 30 min leían
# todo el árbol del campo y consumían cuota diaria de Firestore. Las alertas
# push ya están verificadas. Para reactivar, descomentar el bloque `schedule`.
on:
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  evaluar-y-enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Instalar dependencias
        working-directory: firebase
        run: npm ci

      - name: Evaluar umbrales y enviar push
        working-directory: firebase
        run: node fcm_alerts.js
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
